name: release

# 推送 v* 标签（如 v0.1.1）时自动构建并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本自动读取 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Elimitate ${{ github.ref_name }}"
          releaseBody: |
            自动构建的 Elimitate 发布版（新图标、新功能）。
            详细说明见 [README](https://github.com/jianyunyi/elimitate#readme)。
          releaseDraft: false
          prerelease: false

      # 额外上传免安装绿色版（tauri-action 默认只传 bundle 目录）
      - name: Upload portable binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} src-tauri/target/release/elimitate.exe --clobber
